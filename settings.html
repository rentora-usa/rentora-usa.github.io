<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings | Rentora</title><link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-pending">
<header class="site-header">
  <a class="logo" href="index.html">rentora<span>.</span></a>
  <nav class="main-nav"><a href="index.html">Explore</a><a href="about.html">About</a></nav>
  <div class="header-actions">
    <a href="login.html" class="host-link">List an item</a>
    <div class="account-menu">
      <button type="button" class="avatar-button" id="avatarButton" aria-haspopup="true" aria-label="Account">♙</button>
      <div class="account-dropdown" id="accountDropdown"></div>
    </div>
  </div>
</header>

<main class="page-shell">
  <div class="dash-header">
    <div><p class="eyebrow">Account</p><h1 style="font:700 34px Manrope;letter-spacing:-1.2px;margin:0">Settings</h1></div>
    <a href="dashboard.html" class="text-link">← Back to dashboard</a>
  </div>

  <div class="settings-grid" style="margin-top:36px">
    <section class="settings-card">
      <h2>Profile</h2>
      <p class="muted">This is what other Rentora members see on your listings.</p>
      <form id="profileForm">
        <label>Display name<input id="displayName" type="text" maxlength="80" required></label>
        <label>Location<input id="location" type="text" maxlength="80" placeholder="East Greenwich, RI"></label>
        <label>Bio<textarea id="bio" rows="4" maxlength="500" placeholder="A line or two about you"></textarea></label>
        <label>Photo URL<input id="photoURL" type="text" placeholder="https://example.com/me.jpg"></label>
        <button class="primary-button full" type="submit" id="profileSubmit">Save changes</button>
      </form>
      <p id="profileMessage" class="auth-error hidden"></p>
    </section>

    <section class="settings-card danger-zone">
      <h2>Account</h2>
      <div class="settings-readonly">
        <div><strong>Email:</strong> <span id="accountEmail">—</span></div>
        <div><strong>Sign-in method:</strong> <span id="accountProvider">—</span></div>
        <div><strong>Member since:</strong> <span id="accountCreated">—</span></div>
      </div>
      <form style="margin-top:28px">
        <button type="button" class="chip-btn" id="signOutBtn">Log out of Rentora</button>
      </form>
    </section>
  </div>
</main>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/header-auth.js"></script>
<script type="module" src="js/settings.js"></script>
</body>
</html>
