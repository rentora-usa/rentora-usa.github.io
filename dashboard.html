<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Rentora</title><link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-pending">
<header class="site-header">
  <a class="logo" href="index.html">rentora<span>.</span></a>
  <nav class="main-nav"><a href="index.html">Explore</a><a href="help.html">Help</a><a href="messages.html" id="messagesNavLink" class="hidden">Messages<span class="nav-badge hidden" id="messagesBadge">0</span></a></nav>
  <div class="header-actions">
    <a href="create-listing.html" class="host-link">List an item</a>
    <div class="account-menu">
      <button type="button" class="avatar-button" id="avatarButton" aria-haspopup="true" aria-label="Account">♙</button>
      <div class="account-dropdown" id="accountDropdown"></div>
    </div>
  </div>
</header>

<main class="page-shell">
  <div class="dash-header">
    <div><p class="eyebrow">Your account</p><h1 style="font:700 34px Manrope;letter-spacing:-1.2px;margin:0">Dashboard</h1></div>
    <a href="create-listing.html" class="primary-button">List a new item</a>
  </div>

  <div class="tab-row">
    <button class="tab-btn active" data-tab="listings">My listings</button>
    <button class="tab-btn" data-tab="renting">Rentals I've requested</button>
    <button class="tab-btn" data-tab="owner">Requests I've received</button>
  </div>

  <section class="tab-panel" id="panel-listings">
    <div class="manage-list" id="listingsList"><p class="state-message">Loading your listings…</p></div>
  </section>

  <section class="tab-panel hidden" id="panel-renting">
    <div class="manage-list" id="rentingList"><p class="state-message">Loading…</p></div>
  </section>

  <section class="tab-panel hidden" id="panel-owner">
    <div class="manage-list" id="ownerList"><p class="state-message">Loading…</p></div>
  </section>
</main>

<script type="module" src="js/firebase.js"></script>
<script type="module" src="js/header-auth.js"></script>
<script type="module" src="js/dashboard.js"></script>
</body>
</html>
